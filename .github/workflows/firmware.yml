name: firmware build

# Build the ESP32-C3 firmware on every change under firmware/.
on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with ESP-IDF v5.4 (target esp32c3)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32c3
          path: firmware

      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: turd_scooter_fw
          path: |
            firmware/build/turd_scooter_fw.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
          if-no-files-found: warn
